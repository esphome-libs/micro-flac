name: Publish

on:
  release:
    types: [published]

# Least privilege: jobs only read the repo to check out and publish. Jobs that need more should
# add a narrower job-level permissions block rather than widening this default.
permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check library.json and idf_component.yml against the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="${TAG#v}"
          lib="$(jq -r '.version' library.json)"
          idf="$(grep -m1 '^version:' idf_component.yml | sed -e 's/^version:[[:space:]]*//' -e 's/"//g' -e 's/[[:space:]]*$//')"
          echo "tag=$TAG expected=$expected library.json=$lib idf_component.yml=$idf"
          fail=0
          [ "$lib" = "$expected" ] || { echo "::error::library.json version ($lib) != release tag ($expected)"; fail=1; }
          [ "$idf" = "$expected" ] || { echo "::error::idf_component.yml version ($idf) != release tag ($expected)"; fail=1; }
          exit $fail

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    # Long enough to wait out a full CI run (about 20 minutes) on a commit released before its CI
    # finished; the step itself gives up after 40 minutes.
    timeout-minutes: 45
    # Reads workflow-run status and check-run conclusions via the API; no checkout, so contents is
    # not needed, but actions:read and checks:read are.
    permissions:
      actions: read
      checks: read
    steps:
      - name: Verify CI passed on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Block the release unless the aggregate "CI success" check passed on this commit. That job
          # (ci-success in ci.yml) needs every other job and fails if any failed or was cancelled,
          # with skipped jobs treated as passing, so gating on it alone covers the whole suite and
          # tracks future job changes. Resolve the tag to its commit first: github.sha can be an
          # annotated tag's object SHA, which carries no check runs or workflow runs.
          sha="$(gh api "repos/$REPO/commits/$TAG" --jq '.sha')"
          echo "Release commit: $sha"

          # A release published while the commit's CI is still running (or being re-run) waits for
          # it rather than failing; "CI success" only appears once every other job has finished. A
          # commit with no CI run at all gets a few minutes for one to appear, then fails below. A
          # failed API call (a transient error or rate limit) is retried on the next poll rather than
          # refusing the release; five in a row fail the gate. Checking the call's status in the if
          # keeps bash -e from aborting on it, and gh prints a failed call's error body to stdout, so
          # only a successful call's output is parsed as counts.
          start="$(date +%s)"
          failures=0
          while :; do
            if ! runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
              --jq '"\(.total_count) \([.workflow_runs[] | select(.status != "completed")] | length)"')"; then
              failures=$(( failures + 1 ))
              if [ "$failures" -ge 5 ]; then
                echo "::error::Could not read the release commit's CI runs (5 failed API calls in a row). Refusing to publish."
                exit 1
              fi
              echo "::warning::Could not read the release commit's CI runs (attempt $failures of 5); retrying."
              sleep 30
              continue
            fi
            failures=0
            read -r total active <<<"$runs"
            elapsed=$(( $(date +%s) - start ))
            if [ "$active" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$elapsed" -ge 180 ]; }; then
              break
            fi
            if [ "$elapsed" -ge 2400 ]; then
              echo "::error::CI on the release commit did not finish within 40 minutes. Refusing to publish."
              exit 1
            fi
            echo "Waiting for CI on the release commit: $active of $total run(s) still running, ${elapsed}s elapsed."
            sleep 30
          done

          # Take the most recently completed "CI success" run in case the commit was built more than
          # once. The call's status is checked before sorting so an API failure is reported as one
          # rather than as "not found".
          if ! checks="$(gh api "repos/$REPO/commits/$sha/check-runs" \
            --paginate --jq '.check_runs[] | select(.name == "CI success" and .status == "completed") | "\(.completed_at) \(.conclusion)"')"; then
            echo "::error::Could not read the release commit's check runs. Refusing to publish."
            exit 1
          fi
          conclusion="$(printf '%s\n' "$checks" | sort | tail -1 | awk '{print $NF}')"
          echo "Latest completed 'CI success' conclusion: ${conclusion:-<none found>}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI success did not pass on the release commit (got '${conclusion:-not found}'). Refusing to publish."
            exit 1
          fi
          echo "CI success passed on the release commit; proceeding to publish."

  publish-platformio:
    name: Publish to PlatformIO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-version, ci-gate]
    environment: platformio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install platformio
        run: pip install --upgrade platformio
      - name: Publish package
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
        run: pio package publish --owner esphome --non-interactive

  publish-espressif:
    name: Publish to Espressif
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify-version, ci-gate]
    environment: espressif
    permissions:
      id-token: write
      # Job-level permissions replace the workflow default, so re-grant the read checkout needs.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Publish package
        uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          version: ${{ github.event.release.tag_name }}
          components: |
            micro-flac: .
          namespace: esphome
