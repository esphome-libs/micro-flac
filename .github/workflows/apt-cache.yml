---
name: Seed apt cache

# Fills the apt package cache that CI's jobs restore (.github/actions/apt-packages). An entry
# saved on a PR branch is visible to that PR alone, so this runs on main and saves the one entry
# per package set and runner image that every PR restores. The key includes the runner image
# version, so the daily run reseeds after GitHub rolls out a new image even when main is quiet;
# on a cache hit it only restores and reinstalls, which checks the entry still works.
on:
  push:
    branches: [main, ci-cache-apt-packages]  # TEMPORARY: test seeding on this branch
  schedule:
    - cron: '17 6 * * *'
  # Manual "Run workflow" from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: "Seed apt cache: ${{ matrix.set }}"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        set: [llvm, ffmpeg, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Install and cache the ${{ matrix.set }} packages
        uses: ./.github/actions/apt-packages
        with:
          set: ${{ matrix.set }}
          save: "true"
