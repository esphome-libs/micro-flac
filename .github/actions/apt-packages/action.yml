---
name: Install apt packages (cached)
description: >-
  Installs one of CI's apt package sets from .deb files kept in the GitHub Actions cache, so a
  slow or unreachable Ubuntu mirror only matters on a cache miss. The package lists live here and
  nowhere else, because the cache key is derived from them.

inputs:
  set:
    description: "Package set to install: llvm, ffmpeg or clang."
    required: true
  save:
    description: >-
      "true" saves the packages when the cache has no entry for this runner image yet. Only the
      apt-cache workflow sets it: an entry saved on a PR branch is visible to that PR alone, so
      main saves the one entry every PR restores.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve the package set and configure apt
      id: key
      shell: bash
      env:
        SET: ${{ inputs.set }}
      run: |
        # Recommends are kept where a job may rely on them (clang's sanitizer runtimes are a
        # Recommends of clang-NN); ffmpeg's are dozens of packages the tests never touch.
        recommends=true
        case "${SET}" in
          llvm) packages="clang-tidy-18 clang-tools-18" ;;
          ffmpeg) packages="ffmpeg flac" recommends=false ;;
          clang) packages="clang" ;;
          *) echo "::error::unknown apt package set '${SET}'"; exit 1 ;;
        esac
        # Bump to drop every saved entry, e.g. after a bad one was saved.
        cache_version=1
        # The runner sets ImageOS/ImageVersion; os-release covers runners that don't. The image
        # version is in the key because the debs only fit the image they were resolved against.
        # The prefix without it lets a PR try the previous image's entry until main reseeds.
        # The key ends in a delimiter because the cache prefix-matches even the primary key:
        # without it, image version 20261116.202.1 would also match 20261116.202.10.
        image_os="${ImageOS:-$(. /etc/os-release && echo "${ID}${VERSION_ID}")}"
        packages_hash="$(sha256sum <<< "${packages} recommends=${recommends}" | cut -c1-12)"
        prefix="apt-v${cache_version}-${SET}-${packages_hash}-${image_os}-$(uname -m)-"
        {
          echo "packages=${packages}"
          echo "recommends=${recommends}"
          echo "prefix=${prefix}"
          echo "key=${prefix}${ImageVersion:-unknown}-"
        } >> "${GITHUB_OUTPUT}"

        # A stalled mirror fails over in seconds instead of hanging the job. The debs are
        # downloaded by root into a runner-owned folder, which apt's _apt sandbox user can't
        # write to. Named to sort after the image's own zz-retries, since the last value wins.
        sudo tee /etc/apt/apt.conf.d/zzz-ci-apt > /dev/null <<'EOF'
        Acquire::Retries "2";
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        APT::Sandbox::User "root";
        EOF
        # Skip fsyncs and the man-db index rebuild: the runner is thrown away after the job.
        echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/99ci-unsafe-io > /dev/null
        sudo rm -f /var/lib/man-db/auto-update

    - name: Restore cached packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        # A stalled cache download gives up after 2 minutes instead of the default 10, leaving
        # the mirror fallback time to finish inside the jobs' timeouts. Restores take seconds.
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
      with:
        path: ~/.cache/apt-debs/*.deb
        key: ${{ steps.key.outputs.key }}
        # Only jobs that don't save fall back to the previous image's entry. A saving run that
        # did would store those same old debs under the new image's key, and repeated image
        # updates would then carry them forward indefinitely, never picking up Ubuntu's updates.
        restore-keys: ${{ inputs.save != 'true' && steps.key.outputs.prefix || '' }}

    - name: Install packages
      id: install
      shell: bash
      env:
        PACKAGES: ${{ steps.key.outputs.packages }}
        RECOMMENDS: ${{ steps.key.outputs.recommends }}
        RESTORED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        EXACT_HIT: ${{ steps.restore.outputs.cache-hit }}
        SAVE: ${{ inputs.save }}
      run: |
        debs="${HOME}/.cache/apt-debs"
        read -ra package_list <<< "${PACKAGES}"
        # Every apt call is bounded; timeout runs under sudo so it can kill apt-get itself. The
        # archives option is needed even where every .deb is named: without it, apt fails on a
        # cached .deb that upgrades an installed package ("Pathname to install is not absolute").
        apt_get() {
          local limit="$1"
          shift
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 "${limit}" apt-get -q -y \
            -o Dir::Cache::archives="${debs}" -o APT::Install-Recommends="${RECOMMENDS}" "$@"
        }

        if [ -n "${RESTORED_KEY}" ] && compgen -G "${debs}/*.deb" > /dev/null; then
          # Name the packages too: an entry resolved on an image that already had one of them
          # holds no deb for it, and must fall through to the download instead of passing.
          if apt_get 180 install --no-download "${debs}"/*.deb "${package_list[@]}"; then
            echo "Installed ${PACKAGES} from cache entry ${RESTORED_KEY}"
            echo "saveable=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::warning::Cached packages from ${RESTORED_KEY} did not install; downloading them instead"
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 10 60 dpkg --configure -a || true
        fi

        sudo rm -rf "${debs}"
        mkdir -p "${debs}/partial"
        # The mirror calls share one budget: a slow mirror may need most of it for one download
        # (66 MB took over 4 minutes once), while apt's own 15 s timeout catches a dead connection.
        net_deadline=$((SECONDS + 480))
        net_apt() {
          local left=$((net_deadline - SECONDS))
          if [ "${left}" -lt 5 ]; then
            echo "::error::Downloading ${PACKAGES} from the Ubuntu mirror took over 8 minutes"
            return 1
          fi
          apt_get "${left}" "$@"
        }
        download() {
          net_apt install --download-only "${package_list[@]}"
        }
        # Try the image's own package lists first: they are usually fresh enough, and refreshing
        # them is the step a congested mirror makes slow. Refresh only if that download fails;
        # the retry resumes the partial downloads.
        if ! download; then
          # A failing third-party source must not stop the retry; the download reports real failures.
          net_apt update || true
          download
        fi
        apt_get 180 install --no-download "${package_list[@]}"

        # A broken exact entry can't be replaced (cache keys are immutable), so every job would
        # keep restoring it and falling back to the mirror. Fail the seeding run so it gets fixed.
        if [ "${EXACT_HIT}" = "true" ] && [ "${SAVE}" = "true" ]; then
          echo "::error::Cache entry ${RESTORED_KEY} does not install. Bump cache_version in this action, or delete the entry with: gh cache delete ${RESTORED_KEY}"
          exit 1
        fi

        # Nothing to save when the image already had every package.
        if compgen -G "${debs}/*.deb" > /dev/null; then
          echo "saveable=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: Save packages to the cache
      id: save
      if: >-
        inputs.save == 'true'
        && steps.restore.outputs.cache-hit != 'true'
        && steps.install.outputs.saveable == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-debs/*.deb
        key: ${{ steps.key.outputs.key }}

    # actions/cache/save only warns when an upload fails, which would leave the seed green while
    # every PR keeps downloading from the mirror. Check the entry exists (a parallel run saving
    # the same key first also passes).
    - name: Check the entry was saved
      id: saved
      if: steps.save.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-debs/*.deb
        key: ${{ steps.key.outputs.key }}
        lookup-only: true

    - name: Fail if the entry is missing
      if: steps.save.outcome == 'success' && steps.saved.outputs.cache-hit != 'true'
      shell: bash
      env:
        KEY: ${{ steps.key.outputs.key }}
      run: |
        echo "::error::Saving cache entry ${KEY} failed; see the save step's warning"
        exit 1
